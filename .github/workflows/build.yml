name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package-task: :apps:desktop:packageDmg
            artifact-name: rocky-macos-arm64
            artifact-path: apps/desktop/build/compose/binaries/main/dmg/*.dmg
          - os: macos-15-intel
            package-task: :apps:desktop:packageDmg
            artifact-name: rocky-macos-x64
            artifact-path: apps/desktop/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            package-task: :apps:desktop:packageMsi :apps:desktop:packageExe
            artifact-name: rocky-windows
            artifact-path: |
              apps/desktop/build/compose/binaries/main/msi/*.msi
              apps/desktop/build/compose/binaries/main/exe/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: git diff --check
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: python -m unittest discover -s scripts/tests
      - run: ./gradlew build
      - if: runner.os == 'macOS'
        run: ./gradlew koverVerify koverXmlReport
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: rocky-coverage
          path: build/reports/kover/report.xml
      - run: ./gradlew ${{ matrix.package-task }} -ProckyTwitchClientId="${{ vars.ROCKY_TWITCH_CLIENT_ID }}"
      - run: python scripts/release_metadata.py
      - run: python scripts/verify_installation.py
      - if: runner.os == 'macOS'
        run: bash scripts/smoke-install-macos.sh
      - if: runner.os == 'Windows'
        run: ./scripts/smoke-install-windows.ps1
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            apps/desktop/build/compose/binaries/main/BUILDINFO-*.json
          if-no-files-found: error
          retention-days: 7
