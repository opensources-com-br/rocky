name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: rocky-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/release_metadata.py --check-tag
      - run: python -m unittest discover -s scripts/tests
      - name: Require an increasing native version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > previous-releases.json
          python scripts/prepare_release.py --version "$GITHUB_REF_NAME" --previous previous-releases.json

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: :apps:desktop:packageDmg
            name: rocky-macos-arm64
            path: apps/desktop/build/compose/binaries/main/dmg/*.dmg
          - os: macos-15-intel
            task: :apps:desktop:packageDmg
            name: rocky-macos-x64
            path: apps/desktop/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: :apps:desktop:packageMsi :apps:desktop:packageExe
            name: rocky-windows
            path: |
              apps/desktop/build/compose/binaries/main/msi/*.msi
              apps/desktop/build/compose/binaries/main/exe/*.exe
    runs-on: ${{ matrix.os }}
    env:
      ROCKY_MAC_KEYCHAIN: ${{ github.workspace }}/rocky-signing.keychain-db
      ROCKY_NOTARY_PROFILE: rocky-ci-notary
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/release_metadata.py --check-tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          ROCKY_MAC_CERTIFICATE_BASE64: ${{ secrets.ROCKY_MAC_CERTIFICATE_BASE64 }}
          ROCKY_MAC_CERTIFICATE_PASSWORD: ${{ secrets.ROCKY_MAC_CERTIFICATE_PASSWORD }}
        run: |
          ROCKY_MAC_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$ROCKY_MAC_KEYCHAIN_PASSWORD"
          echo "ROCKY_MAC_KEYCHAIN_PASSWORD=$ROCKY_MAC_KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          export ROCKY_MAC_KEYCHAIN_PASSWORD
          scripts/import-macos-signing-certificate.sh
      - name: Build and package
        env:
          ROCKY_MAC_SIGN: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          ROCKY_MAC_SIGN_IDENTITY: ${{ secrets.ROCKY_MAC_SIGN_IDENTITY }}
        run: ./gradlew build ${{ matrix.task }} -ProckyTwitchClientId="${{ vars.ROCKY_TWITCH_CLIENT_ID }}"
      - name: Configure macOS notarization
        if: runner.os == 'macOS'
        env:
          ROCKY_APPLE_ID: ${{ secrets.ROCKY_APPLE_ID }}
          ROCKY_APPLE_TEAM_ID: ${{ secrets.ROCKY_APPLE_TEAM_ID }}
          ROCKY_APPLE_APP_PASSWORD: ${{ secrets.ROCKY_APPLE_APP_PASSWORD }}
        run: scripts/configure-macos-notary.sh
      - name: Notarize macOS package
        if: runner.os == 'macOS'
        run: scripts/notarize-macos.sh
      - name: Record package metadata
        run: python scripts/release_metadata.py
      - name: Import optional Windows signing certificate
        if: runner.os == 'Windows'
        env:
          ROCKY_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.ROCKY_WINDOWS_CERTIFICATE_BASE64 }}
          ROCKY_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.ROCKY_WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-windows-signing-certificate.ps1
      - name: Sign Windows installers
        if: runner.os == 'Windows' && env.ROCKY_WINDOWS_CERT_THUMBPRINT != ''
        run: ./scripts/sign-windows.ps1
      - name: Verify packaged candidate
        run: python scripts/verify_installation.py
      - name: Smoke test macOS installer
        if: runner.os == 'macOS'
        run: bash scripts/smoke-install-macos.sh
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        run: ./scripts/smoke-install-windows.ps1
      - name: Exercise Windows upgrade and restart
        if: runner.os == 'Windows'
        run: ./scripts/smoke-update-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.path }}
            apps/desktop/build/compose/binaries/main/BUILDINFO-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary macOS keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$ROCKY_MAC_KEYCHAIN" || true
      - name: Remove temporary Windows certificate
        if: always() && runner.os == 'Windows' && env.ROCKY_WINDOWS_CERT_THUMBPRINT != ''
        run: Remove-Item "Cert:\CurrentUser\My\$env:ROCKY_WINDOWS_CERT_THUMBPRINT" -Force

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate complete update packages and checksums
        run: python scripts/prepare_release.py --source release-assets --destination release-ready --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-ready -type f -print0)
          prerelease=false
          [[ "$GITHUB_REF_NAME" == *-alpha.* ]] && prerelease=true
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > release-draft.txt; then
            test "$(cat release-draft.txt)" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Rocky $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease"
